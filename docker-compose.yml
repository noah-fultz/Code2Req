services:
  web:
    build: .
    volumes:
      - ./code2req_web:/app
      - graphdb_data:/graphdb-home 
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - REPOSITORY_FEATURE_INPUT_TOKEN_LIMIT=${REPOSITORY_FEATURE_INPUT_TOKEN_LIMIT:-4096}
      - REPOSITORY_FEATURE_CONTEXT_TOKENS=${REPOSITORY_FEATURE_CONTEXT_TOKENS:-8192}
      - REPOSITORY_FEATURE_OUTPUT_TOKENS=${REPOSITORY_FEATURE_OUTPUT_TOKENS:-1024}
      - REPOSITORY_FEATURE_SAFETY_MARGIN_TOKENS=${REPOSITORY_FEATURE_SAFETY_MARGIN_TOKENS:-512}
      - REPOSITORY_FEATURE_TOKENIZER_JSON=${REPOSITORY_FEATURE_TOKENIZER_JSON:-}
      - REPOSITORY_FEATURE_TOKENIZER_MODEL=${REPOSITORY_FEATURE_TOKENIZER_MODEL:-}
      - REPOSITORY_FEATURE_REQUIRE_MODEL_TOKENIZER=${REPOSITORY_FEATURE_REQUIRE_MODEL_TOKENIZER:-false}
    working_dir: /app
    depends_on:
      - graphdb 
    networks:
      - backend

  graphdb:
    image: ontotext/graphdb:10.8.4
    ports:
      - "7200:7200"
    volumes:
      - graphdb_data:/opt/graphdb/home
    networks:
      - backend

volumes:
  graphdb_data:
    driver: local
    driver_opts:
      type: none
      device: ./graphdb_data
      o: bind

networks:
  backend:
